services:
  postgres:
    image: postgres:16-alpine
    container_name: jules-supervisor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-jules_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-jules_password}
      POSTGRES_DB: ${DB_NAME:-jules_supervisor}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-${POSTGRES_PORT:-5439}}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-jules_user} -d ${DB_NAME:-jules_supervisor}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: jules-supervisor-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-${REDIS_PORT:-6389}}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.19.0
    container_name: jules-supervisor-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:${QDRANT_HOST_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: jules-supervisor-migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DB_USER:-jules_user}:${DB_PASSWORD:-jules_password}@postgres:5432/${DB_NAME:-jules_supervisor}?sslmode=disable
    command: ["node", "packages/db/dist/migrate.js"]

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: jules-supervisor-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "${WORKER_HEALTH_PORT:-8080}:8080"
    environment:
      NODE_ENV: production
      SUPERVISOR_MODE: ${SUPERVISOR_MODE:-DRY_RUN}
      AUTO_RESPOND_ENABLED: ${AUTO_RESPOND_ENABLED:-false}
      AUTO_PLAN_APPROVAL_ENABLED: ${AUTO_PLAN_APPROVAL_ENABLED:-false}
      DATABASE_URL: postgresql://${DB_USER:-jules_user}:${DB_PASSWORD:-jules_password}@postgres:5432/${DB_NAME:-jules_supervisor}?sslmode=disable
      REDIS_URL: redis://redis:6379
      JULES_API_BASE_URL: ${JULES_API_BASE_URL:-https://jules.googleapis.com/v1alpha}
      JULES_API_KEY: ${JULES_API_KEY:-mock-jules-key-placeholder}
      AI_PROVIDER_TYPE: ${AI_PROVIDER_TYPE:-endpoint}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_API_KEY: ${AI_API_KEY:-mock-ai-key-placeholder}
      AI_MODEL: ${AI_MODEL:-gpt-4o}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # AES-256-GCM key for encrypting secrets in system_settings. Leave unset
      # for local dev (plaintext) — set a strong value in production.
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:-}
      HEALTH_PORT: 8080
      READY_PORT: 8081
      # Semantic memory (Qdrant + embeddings)
      AI_MEMORY_ENABLED: ${AI_MEMORY_ENABLED:-true}
      AI_MEMORY_RECALL_ENABLED: ${AI_MEMORY_RECALL_ENABLED:-true}
      AI_MEMORY_REFLECTION_ENABLED: ${AI_MEMORY_REFLECTION_ENABLED:-true}
      AI_MEMORY_CONSOLIDATION_ENABLED: ${AI_MEMORY_CONSOLIDATION_ENABLED:-true}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-jules_memory_v1}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://api.openai.com/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-${AI_API_KEY:-mock-ai-key-placeholder}}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "require(''http'').get(''http://localhost:8080/health'', (r) => {r.statusCode === 200 ? process.exit(0) : process.exit(1)})"',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: jules-supervisor-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "3000:3000"
    environment:
      READY_PORT: 8081
      NODE_ENV: production
      PORT: 3000
      SUPERVISOR_MODE: ${SUPERVISOR_MODE:-DRY_RUN}
      DATABASE_URL: postgresql://${DB_USER:-jules_user}:${DB_PASSWORD:-jules_password}@postgres:5432/${DB_NAME:-jules_supervisor}?sslmode=disable
      REDIS_URL: redis://redis:6379
      AI_PROVIDER_TYPE: ${AI_PROVIDER_TYPE:-endpoint}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_MODEL: ${AI_MODEL:-gpt-4o}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required}
      AUTH_USERNAME: ${AUTH_USERNAME:?AUTH_USERNAME is required}
      AUTH_PASSWORD: ${AUTH_PASSWORD:?AUTH_PASSWORD is required}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      # Both processes must decrypt and encrypt the same system_settings rows.
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:-}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "require(''http'').get(''http://localhost:3000/api/health'', (r) => {r.statusCode === 200 ? process.exit(0) : process.exit(1)})"',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  qdrant_data:
    driver: local
