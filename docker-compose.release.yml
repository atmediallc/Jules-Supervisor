services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-jules_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:-jules_supervisor}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-${POSTGRES_PORT:-5439}}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-jules_user} -d ${DB_NAME:-jules_supervisor}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-${REDIS_PORT:-6389}}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.19.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:${QDRANT_HOST_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    image: ${JULES_WORKER_IMAGE:-jules-supervisor-worker:latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    environment:
      NODE_ENV: production
      SUPERVISOR_MODE: ${SUPERVISOR_MODE:-DRY_RUN}
      AUTO_RESPOND_ENABLED: ${AUTO_RESPOND_ENABLED:-false}
      AUTO_PLAN_APPROVAL_ENABLED: ${AUTO_PLAN_APPROVAL_ENABLED:-false}
      DATABASE_URL: postgresql://${DB_USER:-jules_user}:${DB_PASSWORD:-jules_password}@postgres:5432/${DB_NAME:-jules_supervisor}?sslmode=disable
      REDIS_URL: redis://redis:6379
      JULES_API_BASE_URL: ${JULES_API_BASE_URL:-https://jules.googleapis.com/v1alpha}
      JULES_API_KEY: ${JULES_API_KEY:?JULES_API_KEY is required}
      AI_PROVIDER_TYPE: ${AI_PROVIDER_TYPE:-endpoint}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_API_KEY: ${AI_API_KEY:?AI_API_KEY is required}
      AI_MODEL: ${AI_MODEL:-gpt-4o}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # RESET (REST) encryption key for system_settings secrets (AES-256-GCM). When
      # unset, secrets are stored in plaintext — set it in production.
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:?SETTINGS_ENCRYPTION_KEY is required}
      # Semantic memory (Qdrant + embeddings)
      AI_MEMORY_ENABLED: ${AI_MEMORY_ENABLED:-true}
      AI_MEMORY_RECALL_ENABLED: ${AI_MEMORY_RECALL_ENABLED:-true}
      AI_MEMORY_REFLECTION_ENABLED: ${AI_MEMORY_REFLECTION_ENABLED:-true}
      AI_MEMORY_CONSOLIDATION_ENABLED: ${AI_MEMORY_CONSOLIDATION_ENABLED:-true}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-jules_memory_v1}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://api.openai.com/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:?EMBEDDING_API_KEY is required}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}

  web:
    image: ${JULES_WEB_IMAGE:-jules-supervisor-web:latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      SUPERVISOR_MODE: ${SUPERVISOR_MODE:-DRY_RUN}
      DATABASE_URL: postgresql://${DB_USER:-jules_user}:${DB_PASSWORD:-jules_password}@postgres:5432/${DB_NAME:-jules_supervisor}?sslmode=disable
      REDIS_URL: redis://redis:6379
      AI_PROVIDER_TYPE: ${AI_PROVIDER_TYPE:-endpoint}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_MODEL: ${AI_MODEL:-gpt-4o}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:?SETTINGS_ENCRYPTION_KEY is required}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required}
      AUTH_USERNAME: ${AUTH_USERNAME:?AUTH_USERNAME is required}
      AUTH_PASSWORD: ${AUTH_PASSWORD:?AUTH_PASSWORD is required}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  qdrant_data:
    driver: local
